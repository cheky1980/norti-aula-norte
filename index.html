<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Norti | Aula Norte — Simulador de acompañamiento</title>
<meta name="theme-color" content="#123b5d">
<meta name="description" content="Simulador de conversación de Norti, asistente de Aula Norte.">
<style>
:root{
  --bg:#eef1f4; --panel:#ffffff; --ink:#1c2430; --muted:#5b6675; --line:#d5dbe3;
  --bot:#e4ecf7; --user:#1f4e79; --userink:#fff; --accent:#1f4e79;
  --c1:#2e7d6b; --c2:#b8741a; --c3:#6a4fa3; --lim:#b3362f; --fb:#6b7280;
  --font:"Segoe UI","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12161c;--panel:#1b222b;--ink:#e6ebf2;--muted:#9aa5b4;--line:#2d3744;--bot:#26354a;--user:#3b77b3;--accent:#6fa8dc;--c1:#59b8a2;--c2:#e0a050;--c3:#a68ee0;--lim:#ef7f78;--fb:#9ca3af}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);display:flex;justify-content:center;padding:16px}
.app{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;width:100%;max-width:980px;height:calc(100vh - 32px);min-height:480px}
.chat,.map{background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0}
header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700}
header b{display:block;font-size:16px}
header span{font-size:12px;color:var(--muted)}
#log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
.m{max-width:80%;padding:10px 14px;border-radius:14px;line-height:1.45;font-size:15px;white-space:pre-wrap}
.m.bot{background:var(--bot);border-bottom-left-radius:4px;align-self:flex-start}
.m.user{background:var(--user);color:var(--userink);border-bottom-right-radius:4px;align-self:flex-end}
.m a{color:inherit;font-weight:600}
.stamp{display:block;margin-top:6px;font-size:11px;opacity:.72;text-align:right}
.session-meta{display:block;margin-top:4px;font-size:11px;color:var(--muted)}
#trail .trail-time{display:block;font-size:11px;font-weight:400;color:var(--muted);margin-top:2px}
.typing{display:flex;gap:4px;padding:12px 14px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.3}40%{opacity:1}}
.opts{display:flex;flex-wrap:wrap;gap:8px;padding:0 18px 12px}
.opts button{font:inherit;font-size:14px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);padding:8px 13px;border-radius:18px;cursor:pointer;text-align:left}
.opts button:hover,.opts button:focus-visible{background:var(--accent);color:var(--panel);outline:none}
form{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
form input{flex:1;font:inherit;font-size:15px;padding:10px 14px;border:1px solid var(--line);border-radius:20px;background:var(--bg);color:var(--ink)}
form input:focus{outline:2px solid var(--accent);outline-offset:1px}
form button{font:inherit;border:0;background:var(--accent);color:var(--panel);padding:0 18px;border-radius:20px;cursor:pointer;font-weight:600}
.map h2{font-size:15px;margin:0;padding:14px 16px;border-bottom:1px solid var(--line)}
#trail{flex:1;overflow-y:auto;padding:12px 16px;margin:0;list-style:none;font-size:13px}
#trail li{border-left:4px solid var(--fb);padding:4px 0 4px 10px;margin-bottom:6px;color:var(--muted)}
#trail li.last{color:var(--ink);font-weight:600}
#trail small{display:block;font-weight:400;color:var(--muted)}
.legend{padding:12px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:grid;gap:4px}
.legend span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;background:var(--c)}
.reset{margin:0 16px 14px;font:inherit;font-size:13px;padding:8px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;cursor:pointer}
@media (max-width:760px){.app{grid-template-columns:1fr;height:auto}.chat{height:80vh}.map{max-height:320px}}
@media (prefers-reduced-motion:reduce){.typing i{animation:none}}

/* ===== Identidad visual profesional Norti · Aula Norte ===== */
:root{
  --bg:#f2f5f8; --panel:#fff; --ink:#172b3d; --muted:#647486;
  --line:#dce4eb; --bot:#edf4f8; --user:#174d70; --userink:#fff;
  --accent:#174d70; --c1:#25816f; --c2:#b8792a; --c3:#7058a6;
  --lim:#b94a43; --fb:#7b8794;
  --font:Inter,"Segoe UI","Helvetica Neue",Arial,sans-serif;
}
body{
  padding:28px;
  background:
    radial-gradient(ellipse at 12% 0%,rgba(31,104,133,.10),transparent 36%),
    linear-gradient(135deg,#f4f7fa 0%,#eaf0f5 100%);
}
.app{
  max-width:1180px;
  height:min(850px,calc(100vh - 56px));
  min-height:560px;
  grid-template-columns:minmax(0,1fr) 310px;
  gap:20px;
}
.chat,.map{
  border:1px solid rgba(197,210,221,.9);
  border-radius:20px;
  box-shadow:0 18px 48px rgba(26,53,75,.09);
  overflow:hidden;
}
header{
  min-height:82px;
  padding:17px 22px;
  background:linear-gradient(110deg,#123b5d,#1b5b78);
  border:0;
  color:#fff;
}
.avatar{
  width:46px;height:46px;flex:0 0 46px;
  border:1px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.16);
  box-shadow:inset 0 0 0 5px rgba(255,255,255,.06);
  font-size:20px;
}
header b{font-size:18px;letter-spacing:.1px}
header span{color:rgba(255,255,255,.82);font-size:12px}
#log{padding:24px;background:linear-gradient(180deg,#fff,#fbfcfd);gap:14px}
.m{
  max-width:min(82%,620px);
  padding:13px 16px;
  border-radius:17px;
  box-shadow:0 3px 12px rgba(26,53,75,.045);
  font-size:14px;
  line-height:1.55;
}
.m.bot{border:1px solid #e2eaf0;border-bottom-left-radius:5px}
.m.user{background:linear-gradient(135deg,#174d70,#236789);border-bottom-right-radius:5px}
.stamp{font-size:10px;letter-spacing:.1px}
.opts{padding:4px 22px 16px;background:#fff;gap:9px}
.opts button{
  border:1px solid #c6d8e3;
  background:#f8fbfd;
  color:#174d70;
  padding:9px 14px;
  border-radius:999px;
  font-size:13px;
  transition:background .18s ease,transform .18s ease,border-color .18s ease;
}
.opts button:hover,.opts button:focus-visible{
  background:#174d70;color:#fff;border-color:#174d70;transform:translateY(-1px)
}
form{
  padding:15px 20px;
  background:#fff;
  border-top:1px solid #e7edf2;
}
form input{
  min-width:0;background:#f5f8fa;border-color:#d9e2e9;
  padding:12px 16px;font-size:14px;
}
form button{
  min-height:42px;padding:0 21px;
  background:#174d70;color:#fff;
}
.map{background:rgba(255,255,255,.96)}
.map h2{
  padding:20px 20px 16px;
  font-size:15px;color:#183b55;
  letter-spacing:.1px;
}
#trail{padding:17px 20px;font-size:13px}
#trail li{
  border-left-width:3px;
  padding:7px 0 7px 12px;
  margin-bottom:9px;
  line-height:1.35;
}
#trail li.last{color:#183b55}
#trail .trail-time{font-size:10px;margin-top:4px}
.legend{
  padding:16px 20px;
  background:#f8fafb;
  border-top:1px solid #e8edf1;
  gap:7px;
}
.legend span{font-size:11px}
.reset{
  margin:14px 20px 18px;
  padding:10px 12px;
  border-color:#d5dfe6;
  color:#41576a;
  transition:background .18s ease;
}
.reset:hover{background:#f0f5f8}
@media(max-width:760px){
  body{padding:10px}
  .app{grid-template-columns:1fr;height:auto;min-height:0;gap:12px}
  .chat{height:78vh;min-height:500px}
  .map{max-height:340px}
  header{padding:14px 16px}
  #log{padding:17px}
  .m{max-width:90%}
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#111a22;--panel:#17232d;--ink:#e6edf3;--muted:#aab8c4;
    --line:#30414e;--bot:#233746;--user:#2b6689;--accent:#72b4d2;
  }
  body{background:linear-gradient(135deg,#101923,#172633)}
  .chat,.map{border-color:#30414e}
  #log{background:linear-gradient(180deg,#17232d,#192832)}
  .m.bot{border-color:#344a59}
  .opts,form,.map{background:#17232d}
  .opts button{background:#1d303d;border-color:#466174;color:#c7e3f0}
  .opts button:hover,.opts button:focus-visible{background:#2b6689;color:#fff}
  form input{background:#111d26;border-color:#3a4e5d;color:#e6edf3}
  .map h2{color:#e6edf3}
  .legend{background:#1c2b36;border-color:#30414e}
  .reset{border-color:#405361;color:#d2dce4}
  .reset:hover{background:#263946}
}

</style>
</head>
<body>
<main class="app" aria-label="Simulador de conversación Norti de Aula Norte">
  <section class="chat" aria-label="Conversación con Norti">
    <header><div class="avatar">N</div><div><b>Norti</b><span>Aula Norte · Asistente virtual</span></div></header>
    <div id="log" aria-live="polite"></div>
    <div id="opts" class="opts"></div>
    <form id="f"><input id="t" placeholder="Escribí tu consulta o elegí una opción" autocomplete="off" aria-label="Mensaje"><button>Enviar</button></form>
  </section>
  <aside class="map">
    <h2>Recorrido de la conversación</h2>
    <ol id="trail"></ol>
    <div class="legend">
      <span style="--c:var(--c1)">Camino 1: Inscripción</span>
      <span style="--c:var(--c2)">Camino 2: Campus virtual</span>
      <span style="--c:var(--c3)">Camino 3: Organización académica</span>
      <span style="--c:var(--lim)">Pregunta límite</span>
      <span style="--c:var(--fb)">Salida de emergencia / inicio</span>
    </div>
    <button class="reset" id="reset">Reiniciar conversación</button>
  </aside>
</main>

<script>
const MENU = [
  {l:"Quiero inscribirme en un curso", u:"Hola, ¿cómo hago para anotarme en un curso?", n:"c1_1"},
  {l:"No encuentro la clase en el campus", u:"No encuentro la clase de esta semana en el campus.", n:"c2_1"},
  {l:"No llego a entregar los trabajos", u:"Trabajo y no llego a entregar los trabajos a tiempo. ¿Qué hago?", n:"c3_1"},
  {l:"Estoy muy cansada, quiero dejar", u:"Estoy re cansada, creo que voy a dejar todo. No sé si vale la pena.", n:"l_1"}
];
const FIN = {l:"Gracias, nada más", n:"fin"};
const PERSONA = {l:"Quiero hablar con una persona", n:"deriva"};

// tag: i=inicio, 1/2/3 caminos, L=límite, F=salida de emergencia
const N = {
 inicio:{t:"i",name:"Bienvenida",bot:["¡Hola! Soy Norti, el asistente de Aula Norte 🎓. Te puedo orientar con inscripciones, cursada, materias y campus virtual. Si tu consulta necesita a una persona del equipo, te digo a quién escribirle. ¿En qué te ayudo?"],opts:MENU},

 c1_1:{t:"1",name:"¿Sabés qué curso querés?",bot:["¡Hola! Te cuento. Primero necesito saber algo: ¿ya sabés qué curso querés o preferís que te muestre los que hay?"],opts:[{l:"Quiero ver cuáles hay, pero tengo que cursar de noche",n:"c1_2"},{l:"Ya sé cuál quiero: Excel para el trabajo",n:"c1_4"}]},
 c1_2:{t:"1",name:"Área de interés",bot:["Entendido, busco opciones nocturnas. ¿Te interesa más algo de administración, informática u oficios?"],opts:[{l:"Informática",n:"c1_3"},{l:"Administración u oficios",n:"c1_alt"}]},
 c1_alt:{t:"1",name:"Sin opciones nocturnas",bot:["Por ahora no tengo cursos nocturnos de esa área cargados. El equipo de administración puede confirmarte si hay novedades."],opts:[{l:"Sí, pasame el contacto",n:"deriva"},{l:"Prefiero ver informática",n:"c1_3"}]},
 c1_3:{t:"1",name:"Opciones de informática",bot:["Tenemos:\n• Excel para el trabajo: martes y jueves, 19 a 21 h, presencial.\n• Introducción a la programación: lunes y miércoles, 20 a 22 h, virtual.\n\n¿Querés que te cuente los requisitos de alguno?"],opts:[{l:"El de Excel",n:"c1_4"},{l:"El de programación",n:"c1_4"}]},
 c1_4:{t:"1",name:"Requisitos y formulario",bot:["Para inscribirte necesitás tu DNI y completar el formulario online. Te dejo el link: aulanorte.example/inscripcion\n\nSi te surge una duda en el medio, escribime acá."],opts:[FIN,{l:"Me traba el formulario",n:"deriva"}]},

 c2_1:{t:"2",name:"¿Pudiste ingresar?",bot:["Te ayudo con eso. ¿Ya lograste ingresar al campus o no podés entrar?"],opts:[{l:"Sí, entré, pero no veo nada",n:"c2_2"},{l:"No puedo entrar",n:"c2_login"}]},
 c2_login:{t:"2",name:"Problema de acceso",bot:["Probá con la opción “Olvidé mi contraseña” en la pantalla de ingreso. Si no te llega el correo en unos minutos, administración puede restablecerlo. ¿Querés que te pase el contacto?"],opts:[{l:"Sí, por favor",n:"deriva"},FIN]},
 c2_2:{t:"2",name:"¿Qué curso?",bot:["Bien. ¿Cómo se llama el curso que estás cursando?"],opts:[{l:"Contabilidad básica",n:"c2_3"}]},
 c2_3:{t:"2",name:"Guía paso a paso",bot:["Gracias. Entrá a “Mis cursos” y tocá “Contabilidad básica”. Las clases están en la sección “Semana 5”. ¿La ves?"],opts:[{l:"Sí, ya la encontré",n:"fin"},{l:"Veo la semana 4 nada más",n:"c2_4"}]},
 c2_4:{t:"2",name:"Derivación al docente",bot:["Puede ser que el docente todavía no la haya publicado. Eso solo lo puede confirmar él. ¿Querés que te pase su contacto?"],opts:[{l:"Sí, pasame el contacto",n:"deriva"},FIN]},

 c3_1:{t:"3",name:"¿Uno o varios trabajos?",bot:["Gracias por contármelo. Se puede organizar. ¿Hablamos de un trabajo en particular o de varios?"],opts:[{l:"De dos",n:"c3_2"}]},
 c3_2:{t:"3",name:"¿Fechas vencidas?",bot:["Entiendo. ¿Las fechas de entrega ya pasaron o todavía no?"],opts:[{l:"Una ya pasó, la otra es el viernes",n:"c3_3"}]},
 c3_3:{t:"3",name:"Tiempo disponible",bot:["Para la del viernes puedo ayudarte a organizarte. ¿Cuántas horas tenés disponibles por día esta semana?"],opts:[{l:"Unas dos horas a la noche",n:"c3_4"}]},
 c3_4:{t:"3",name:"Plan + derivación al tutor",bot:["Con dos horas diarias podés dividir el trabajo en tres bloques antes del viernes.\n\nPara la entrega que ya pasó, quien decide si hay prórroga es tu docente o tutor. ¿Querés que te pase cómo contactarlo?"],opts:[{l:"Sí, pasame el contacto",n:"deriva"},FIN]},

 l_1:{t:"L",name:"Pregunta límite: “voy a dejar todo”",bot:["Gracias por contármelo. Se nota que venís con mucha carga. Yo no soy la persona indicada para decidir esto por vos, pero en Aula Norte hay un equipo de tutoría que acompaña justamente estas situaciones. ¿Querés que te ponga en contacto con alguien?"],opts:[{l:"Ok, pero no quiero explicar todo de nuevo",n:"l_2"},{l:"No, prefiero seguir sola",n:"l_no"}]},
 l_2:{t:"L",name:"Límite: datos mínimos",bot:["Tranquila. Solo le paso tu nombre y el curso, y vos contás lo que quieras cuando hablen. ¿Me los pasás?"],opts:[{l:"Soy Laura, de Contabilidad básica",n:"l_3"}]},
 l_3:{t:"L",name:"Límite: cierre con derivación",bot:["Gracias, Laura. Ya avisé al equipo de tutoría y te van a contactar por WhatsApp dentro de las 48 h hábiles. Mientras tanto, no tenés que decidir nada hoy."],opts:[],end:true},
 l_no:{t:"L",name:"Límite: respeta la decisión",bot:["Está bien. Si más adelante cambiás de idea, el equipo de tutoría está disponible de lunes a viernes. ¿Te ayudo con alguna otra consulta?"],opts:MENU},

 deriva:{t:"F",name:"Derivación a una persona",bot:["Te paso el contacto: equipo de administración, WhatsApp 351 000-0000, lunes a viernes de 9 a 18 h. Te van a responder dentro de 48 h hábiles. ¿Te ayudo con algo más?"],opts:[{l:"Sí, otra consulta",n:"inicio_menu"},FIN]},
 inicio_menu:{t:"i",name:"Nueva consulta",bot:["Dale. ¿Sobre qué es tu consulta?"],opts:MENU},
 fallback:{t:"F",name:"Salida de emergencia: no entendí",bot:["No estoy seguro de haber entendido bien, y prefiero no inventarte una respuesta. Podés elegir uno de estos temas o te paso con una persona del equipo."],opts:MENU.concat([PERSONA])},
 fin:{t:"F",name:"Cierre",bot:["¡Genial! Cualquier cosa, escribime acá. Aula Norte atiende de lunes a viernes de 9 a 18 h. ¡Mucha suerte con la cursada! 🎓"],opts:[],end:true}
};

const COLORS={i:"var(--fb)",F:"var(--fb)","1":"var(--c1)","2":"var(--c2)","3":"var(--c3)",L:"var(--lim)"};
const KEYS=[
 [/inscri|anotar|curso nuevo|quiero hacer un curso/i,"c1_1"],
 [/campus|clase|contrase|entrar|ingresar|plataforma/i,"c2_1"],
 [/trabajo|entrega|tiempo|llego|libre/i,"c3_1"],
 [/cansad|dejar|abandon|no puedo m[aá]s|vale la pena/i,"l_1"],
 [/persona|humano|docente|tutor|alguien/i,"deriva"]
];

const log=document.getElementById("log"),optsEl=document.getElementById("opts"),trail=document.getElementById("trail"),inp=document.getElementById("t");
let busy=false;
let sessionId="";

// Todas las marcas horarias se muestran en horario de Argentina.
const dateTimeFormatter=new Intl.DateTimeFormat("es-AR",{
  timeZone:"America/Argentina/Buenos_Aires",
  day:"2-digit",month:"2-digit",year:"numeric",
  hour:"2-digit",minute:"2-digit",second:"2-digit",
  hourCycle:"h23"
});
function timestamp(){
  return dateTimeFormatter.format(new Date());
}
function createSession(){
  sessionId=(window.crypto && crypto.randomUUID)
    ? crypto.randomUUID()
    : "NORTI-"+Date.now()+"-"+Math.random().toString(36).slice(2,8);
}

function bubble(text,who){
  const d=document.createElement("div");d.className="m "+who;
  const parts=text.split(/(aulanorte\.example\/\S+)/);
  parts.forEach(p=>{ if(/^aulanorte\.example/.test(p)){const a=document.createElement("a");a.href="#";a.textContent=p;a.onclick=e=>e.preventDefault();d.appendChild(a);} else d.appendChild(document.createTextNode(p)); });
  const stamp=document.createElement("small");stamp.className="stamp";stamp.textContent=timestamp()+" (Argentina)";d.appendChild(stamp);
   log.appendChild(d);log.scrollTop=log.scrollHeight;
}
function addTrail(id){
  const n=N[id];
  trail.querySelectorAll("li").forEach(l=>l.classList.remove("last"));
  const li=document.createElement("li");li.className="last";li.style.borderLeftColor=COLORS[n.t];
  const label=document.createElement("span");label.textContent=n.name;li.appendChild(label);
  const time=document.createElement("small");time.className="trail-time";time.textContent=timestamp()+" (Argentina)";li.appendChild(time);
  trail.appendChild(li);trail.scrollTop=trail.scrollHeight;
}
function go(id){
  busy=true;optsEl.innerHTML="";
  const n=N[id];
  const ty=document.createElement("div");ty.className="m bot typing";ty.innerHTML="<i></i><i></i><i></i>";
  log.appendChild(ty);log.scrollTop=log.scrollHeight;
  setTimeout(()=>{
    ty.remove();
    n.bot.forEach(b=>bubble(b,"bot"));
    addTrail(id);
    if(n.end){
      const b=document.createElement("button");b.textContent="Empezar de nuevo";b.onclick=start;optsEl.appendChild(b);
    } else {
      n.opts.forEach(o=>{
        const b=document.createElement("button");b.textContent=o.l;
        b.onclick=()=>choose(o);optsEl.appendChild(b);
      });
    }
    busy=false;
  },650);
}
function choose(o){
  if(busy)return;
  bubble(o.u||o.l,"user");
  go(o.n);
}
function free(text){
  if(busy)return;
  bubble(text,"user");
  const k=KEYS.find(([re])=>re.test(text));
  go(k?k[1]:"fallback");
}
document.getElementById("f").addEventListener("submit",e=>{
  e.preventDefault();const v=inp.value.trim();if(!v)return;inp.value="";free(v);
});
function start(){
  createSession();
  log.innerHTML="";trail.innerHTML="";optsEl.innerHTML="";go("inicio");
}
document.getElementById("reset").onclick=start;
start();
</script>
</body>
</html>
