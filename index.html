body:after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(135deg,rgba(15,38,72,.55),rgba(20,30,50,.35) 50%,rgba(242,163,58,.25))}
@media (prefers-color-scheme:dark){body:after{background:linear-gradient(135deg,rgba(8,14,26,.78),rgba(10,16,28,.62) 50%,rgba(60,40,10,.45))}}

.app{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:18px;width:100%;max-width:1000px;height:calc(100vh - 40px);min-height:520px}
.chat,.side{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;min-height:0;box-shadow:var(--shadow);overflow:hidden}

/* Cabecera */
header{padding:16px 20px;display:flex;align-items:center;gap:14px;
  background:linear-gradient(120deg,#163f72,#2a68ad);color:#fff}
.avatar{position:relative;width:48px;height:48px;flex:none}
.avatar svg{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 8px rgba(0,0,0,.25))}
.avatar .dot{position:absolute;right:1px;bottom:1px;width:12px;height:12px;border-radius:50%;background:var(--ok);border:2px solid #22558f}
header b{display:block;font-size:17px;letter-spacing:.2px}
header span{font-size:12.5px;opacity:.85}

/* Mensajes */
#log{flex:1;overflow-y:auto;padding:22px 20px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.row{display:flex;gap:10px;align-items:flex-end;animation:in .28s ease-out}
.row.user{justify-content:flex-end}
.row .mini{width:30px;height:30px;flex:none}
.row .mini svg{width:100%;height:100%}
.m{max-width:78%;padding:11px 15px;border-radius:18px;line-height:1.5;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.m.bot{background:var(--bot);border:1px solid var(--botline);border-bottom-left-radius:6px;box-shadow:0 2px 6px rgba(20,40,70,.06)}
.m.user{background:linear-gradient(135deg,var(--user1),var(--user2));color:var(--userink);border-bottom-right-radius:6px;box-shadow:0 4px 12px -4px rgba(29,79,140,.5)}
.m a{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.m.user a{color:#fff}
.stamp{display:block;margin-top:6px;font-size:11px;opacity:.65;text-align:right;white-space:nowrap}
.typing{display:flex;gap:5px;padding:14px 16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Opciones rápidas */
.opts{display:flex;flex-wrap:wrap;gap:8px;padding:2px 20px 14px 60px}
.opts:empty{display:none}
.opts button{font:inherit;font-size:14px;border:1.5px solid var(--accent);background:var(--solid);color:var(--accent);padding:8px 14px;border-radius:999px;cursor:pointer;text-align:left;transition:all .15s;animation:in .3s ease-out}
.opts button:hover,.opts button:focus-visible{background:var(--accent);color:var(--solid);outline:none;transform:translateY(-1px)}

/* Entrada */
form{display:flex;gap:10px;padding:14px 18px;border-top:1px solid var(--line);background:var(--panel)}
form input{flex:1;font:inherit;font-size:15px;padding:12px 18px;border:1px solid var(--line);border-radius:999px;background:var(--solid);color:var(--ink)}
form input:focus{outline:2px solid var(--accent);outline-offset:1px}
form button{width:46px;height:46px;flex:none;border:0;border-radius:50%;cursor:pointer;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--user1),var(--user2));color:#fff;box-shadow:0 4px 12px -4px rgba(29,79,140,.6);transition:transform .15s}
form button:hover{transform:scale(1.06)}
form button svg{width:20px;height:20px}

/* Panel lateral */
.side h2{font-size:14px;margin:0;padding:16px 18px 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:600}
.card{margin:0 14px 12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--solid);font-size:13.5px;line-height:1.5}
.card b{display:block;margin-bottom:4px;font-size:14px}
.card p{margin:0;color:var(--muted)}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 6px}
.brand svg{width:34px;height:34px}
.brand div{font-weight:700;font-size:16px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px}
#trail{flex:1;overflow-y:auto;padding:4px 18px 10px;margin:0;list-style:none;font-size:13px;counter-reset:s}
#trail li{position:relative;padding:5px 0 5px 22px;color:var(--muted);counter-increment:s}
#trail li:before{content:"";position:absolute;left:5px;top:12px;width:7px;height:7px;border-radius:50%;background:var(--line)}
#trail li:after{content:"";position:absolute;left:8px;top:21px;bottom:-8px;width:1px;background:var(--line)}
#trail li:last-child:after{display:none}
#trail li.last{color:var(--ink);font-weight:600}
#trail .trail-time{display:block;font-size:11px;font-weight:400;color:var(--muted);margin-top:2px}
#trail li.last:before{background:var(--accent2);box-shadow:0 0 0 3px rgba(242,163,58,.25)}
.reset{margin:6px 14px 16px;font:inherit;font-size:13.5px;padding:10px;border:1px solid var(--line);background:var(--solid);color:var(--ink);border-radius:12px;cursor:pointer;transition:all .15s}
.reset:hover{border-color:var(--accent);color:var(--accent)}

@media (max-width:780px){
  body{padding:10px}
  .app{grid-template-columns:1fr;height:auto}
  .chat{height:86vh}
  .side{max-height:none}
  .opts{padding-left:20px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- Ícono de Norti: búho-guía con gorro de egresado y estrella del norte -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="ng" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f74c0"/><stop offset="1" stop-color="#173f73"/></linearGradient>
    <symbol id="norti" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="31" fill="url(#ng)"/>
      <circle cx="32" cy="32" r="31" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="1.5"/>
      <!-- cuerpo -->
      <path d="M17 30c0-9 6.7-14 15-14s15 5 15 14v8c0 9-6.7 15-15 15s-15-6-15-15z" fill="#f4f7fb"/>
      <path d="M24 44c2.5 3 5 4.4 8 4.4s5.5-1.4 8-4.4" fill="none" stroke="#c9d6e8" stroke-width="2" stroke-linecap="round"/>
      <!-- ojos -->
      <circle cx="25.5" cy="32" r="6" fill="#fff" stroke="#173f73" stroke-width="1.6"/>
      <circle cx="38.5" cy="32" r="6" fill="#fff" stroke="#173f73" stroke-width="1.6"/>
      <circle cx="26.3" cy="32.6" r="2.7" fill="#173f73"/><circle cx="39.3" cy="32.6" r="2.7" fill="#173f73"/>
      <circle cx="27.2" cy="31.6" r=".9" fill="#fff"/><circle cx="40.2" cy="31.6" r=".9" fill="#fff"/>
      <!-- pico -->
      <path d="M32 36.5l-2.3 3 2.3 2 2.3-2z" fill="#f2a33a"/>
      <!-- gorro de egresado -->
      <path d="M32 9l15 6-15 6-15-6z" fill="#1b2a40"/>
      <path d="M24 18.5v4c2.4 1.4 5 2 8 2s5.6-.6 8-2v-4l-8 3.2z" fill="#26384f"/>
      <path d="M45 15.5v7" stroke="#f2a33a" stroke-width="1.4"/>
      <circle cx="45" cy="23.5" r="1.6" fill="#f2a33a"/>
      <!-- estrella del norte -->
      <path d="M52 6l1.3 3.6 3.7 1.3-3.7 1.3L52 16l-1.3-3.8-3.7-1.3 3.7-1.3z" fill="#f2c063"/>
    </symbol>
  </defs>
</svg>

<div class="app">
  <section class="chat" aria-label="Conversación con Norti">
    <header>
      <div class="avatar"><svg><use href="#norti"/></svg><span class="dot" title="En línea"></span></div>
      <div><b>Norti</b><span>Asistente virtual de Aula Norte · en línea</span></div>
    </header>
    <div id="log" aria-live="polite"></div>
    <div id="opts" class="opts"></div>
    <form id="f">
      <input id="t" placeholder="Escribí tu consulta o elegí una opción…" autocomplete="off" aria-label="Mensaje">
      <button aria-label="Enviar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-8-6 16-2.5-6.5z"/><path d="M11.5 13.5L20 4"/></svg></button>
    </form>
  </section>

  <aside class="side">
    <div class="brand"><svg><use href="#norti"/></svg><div>Aula Norte<small>Córdoba · presencial y virtual</small></div></div>
    <h2>Te puedo ayudar con</h2>
    <div class="card"><p>📝 Inscripciones<br>💻 Campus virtual<br>📅 Organización de la cursada<br>🤝 Contacto con tutores y docentes</p></div>
    <div class="card"><b>Atención humana</b><p>Lunes a viernes de 9 a 18 h<br>WhatsApp 351 000-0000</p></div>
    <h2>Tu consulta</h2>
    <ol id="trail"></ol>
    <button class="reset" id="reset">↺ Empezar una nueva conversación</button>
  </aside>
</div>

<script>
const MENU = [
  {l:"Quiero inscribirme en un curso", u:"Hola, ¿cómo hago para anotarme en un curso?", n:"c1_1"},
  {l:"No encuentro la clase en el campus", u:"No encuentro la clase de esta semana en el campus.", n:"c2_1"},
  {l:"No llego a entregar los trabajos", u:"Trabajo y no llego a entregar los trabajos a tiempo. ¿Qué hago?", n:"c3_1"},
  {l:"Estoy muy cansada, quiero dejar", u:"Estoy re cansada, creo que voy a dejar todo. No sé si vale la pena.", n:"l_1"}
];
const FIN = {l:"Gracias, nada más", n:"fin"};
const PERSONA = {l:"Quiero hablar con una persona", n:"deriva"};

// "name" = paso que se muestra al usuario en "Tu consulta" (sin revelar caminos internos)
const N = {
 inicio:{name:"Bienvenida",bot:["¡Hola! Soy Norti, el asistente de Aula Norte 🎓. Te puedo orientar con inscripciones, cursada, materias y campus virtual. Si tu consulta necesita a una persona del equipo, te digo a quién escribirle. ¿En qué te ayudo?"],opts:MENU},

 c1_1:{name:"Inscripción a un curso",bot:["¡Hola! Te cuento. Primero necesito saber algo: ¿ya sabés qué curso querés o preferís que te muestre los que hay?"],opts:[{l:"Quiero ver cuáles hay, pero tengo que cursar de noche",n:"c1_2"},{l:"Ya sé cuál quiero: Excel para el trabajo",n:"c1_4"}]},
 c1_2:{name:"Área de interés",bot:["Entendido, busco opciones nocturnas. ¿Te interesa más algo de administración, informática u oficios?"],opts:[{l:"Informática",n:"c1_3"},{l:"Administración u oficios",n:"c1_alt"}]},
 c1_alt:{name:"Cursos disponibles",bot:["Por ahora no tengo cursos nocturnos de esa área cargados. El equipo de administración puede confirmarte si hay novedades."],opts:[{l:"Sí, pasame el contacto",n:"deriva"},{l:"Prefiero ver informática",n:"c1_3"}]},
 c1_3:{name:"Cursos de informática",bot:["Tenemos:\n• Excel para el trabajo: martes y jueves, 19 a 21 h, presencial.\n• Introducción a la programación: lunes y miércoles, 20 a 22 h, virtual.\n\n¿Querés que te cuente los requisitos de alguno?"],opts:[{l:"El de Excel",n:"c1_4"},{l:"El de programación",n:"c1_4"}]},
 c1_4:{name:"Requisitos y formulario",bot:["Para inscribirte necesitás tu DNI y completar el formulario online. Te dejo el link: aulanorte.example/inscripcion\n\nSi te surge una duda en el medio, escribime acá."],opts:[FIN,{l:"Me traba el formulario",n:"deriva"}]},

 c2_1:{name:"Campus virtual",bot:["Te ayudo con eso. ¿Ya lograste ingresar al campus o no podés entrar?"],opts:[{l:"Sí, entré, pero no veo nada",n:"c2_2"},{l:"No puedo entrar",n:"c2_login"}]},
 c2_login:{name:"Acceso al campus",bot:["Probá con la opción “Olvidé mi contraseña” en la pantalla de ingreso. Si no te llega el correo en unos minutos, administración puede restablecerlo. ¿Querés que te pase el contacto?"],opts:[{l:"Sí, por favor",n:"deriva"},FIN]},
 c2_2:{name:"Tu curso",bot:["Bien. ¿Cómo se llama el curso que estás cursando?"],opts:[{l:"Contabilidad básica",n:"c2_3"}]},
 c2_3:{name:"Guía paso a paso",bot:["Gracias. Entrá a “Mis cursos” y tocá “Contabilidad básica”. Las clases están en la sección “Semana 5”. ¿La ves?"],opts:[{l:"Sí, ya la encontré",n:"fin"},{l:"Veo la semana 4 nada más",n:"c2_4"}]},
 c2_4:{name:"Contacto con el docente",bot:["Puede ser que el docente todavía no la haya publicado. Eso solo lo puede confirmar él. ¿Querés que te pase su contacto?"],opts:[{l:"Sí, pasame el contacto",n:"deriva"},FIN]},

 c3_1:{name:"Organización de entregas",bot:["Gracias por contármelo. Se puede organizar. ¿Hablamos de un trabajo en particular o de varios?"],opts:[{l:"De dos",n:"c3_2"}]},
 c3_2:{name:"Fechas de entrega",bot:["Entiendo. ¿Las fechas de entrega ya pasaron o todavía no?"],opts:[{l:"Una ya pasó, la otra es el viernes",n:"c3_3"}]},
 c3_3:{name:"Tiempo disponible",bot:["Para la del viernes puedo ayudarte a organizarte. ¿Cuántas horas tenés disponibles por día esta semana?"],opts:[{l:"Unas dos horas a la noche",n:"c3_4"}]},
 c3_4:{name:"Plan de trabajo",bot:["Con dos horas diarias podés dividir el trabajo en tres bloques antes del viernes.\n\nPara la entrega que ya pasó, quien decide si hay prórroga es tu docente o tutor. ¿Querés que te pase cómo contactarlo?"],opts:[{l:"Sí, pasame el contacto",n:"deriva"},FIN]},

 l_1:{name:"Acompañamiento",bot:["Gracias por contármelo. Se nota que venís con mucha carga. Yo no soy la persona indicada para decidir esto por vos, pero en Aula Norte hay un equipo de tutoría que acompaña justamente estas situaciones. ¿Querés que te ponga en contacto con alguien?"],opts:[{l:"Ok, pero no quiero explicar todo de nuevo",n:"l_2"},{l:"No, prefiero seguir sola",n:"l_no"}]},
 l_2:{name:"Tus datos de contacto",bot:["Tranquila. Solo le paso tu nombre y el curso, y vos contás lo que quieras cuando hablen. ¿Me los pasás?"],opts:[{l:"Soy Laura, de Contabilidad básica",n:"l_3"}]},
 l_3:{name:"Equipo de tutoría avisado",bot:["Gracias, Laura. Ya avisé al equipo de tutoría y te van a contactar por WhatsApp dentro de las 48 h hábiles. Mientras tanto, no tenés que decidir nada hoy."],opts:[],end:true},
 l_no:{name:"Seguimos cuando quieras",bot:["Está bien. Si más adelante cambiás de idea, el equipo de tutoría está disponible de lunes a viernes. ¿Te ayudo con alguna otra consulta?"],opts:MENU},

 deriva:{name:"Contacto con una persona",bot:["Te paso el contacto: equipo de administración, WhatsApp 351 000-0000, lunes a viernes de 9 a 18 h. Te van a responder dentro de 48 h hábiles. ¿Te ayudo con algo más?"],opts:[{l:"Sí, otra consulta",n:"inicio_menu"},FIN]},
 inicio_menu:{name:"Nueva consulta",bot:["Dale. ¿Sobre qué es tu consulta?"],opts:MENU},
 fallback:{name:"Aclaración",bot:["No estoy seguro de haber entendido bien, y prefiero no inventarte una respuesta. Podés elegir uno de estos temas o te paso con una persona del equipo."],opts:MENU.concat([PERSONA])},
 fin:{name:"Cierre",bot:["¡Genial! Cualquier cosa, escribime acá. Aula Norte atiende de lunes a viernes de 9 a 18 h. ¡Mucha suerte con la cursada! 🎓"],opts:[],end:true}
};

const KEYS=[
 [/inscri|anotar|curso nuevo|quiero hacer un curso/i,"c1_1"],
 [/campus|clase|contrase|entrar|ingresar|plataforma/i,"c2_1"],
 [/trabajo|entrega|tiempo|llego|libre/i,"c3_1"],
 [/cansad|dejar|abandon|no puedo m[aá]s|vale la pena/i,"l_1"],
 [/persona|humano|docente|tutor|alguien/i,"deriva"]
];

const log=document.getElementById("log"),optsEl=document.getElementById("opts"),trail=document.getElementById("trail"),inp=document.getElementById("t");
let busy=false;

// Marcas de fecha y hora en horario de Córdoba, Argentina
const LUGAR="Córdoba, Argentina";
const fmt=new Intl.DateTimeFormat("es-AR",{timeZone:"America/Argentina/Cordoba",
  day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"});
function timestamp(){ return fmt.format(new Date())+" · "+LUGAR; }

function row(who){
  const r=document.createElement("div");r.className="row "+who;
  if(who==="bot"){const a=document.createElementNS("http://www.w3.org/2000/svg","svg");a.setAttribute("class","mini");a.innerHTML='<use href="#norti"/>';const w=document.createElement("div");w.className="mini";w.appendChild(a);r.appendChild(w);}
  log.appendChild(r);return r;
}
function bubble(text,who){
  const r=row(who);
  const d=document.createElement("div");d.className="m "+who;
  text.split(/(aulanorte\.example\/\S+)/).forEach(p=>{
    if(/^aulanorte\.example/.test(p)){const a=document.createElement("a");a.href="#";a.textContent=p;a.onclick=e=>e.preventDefault();d.appendChild(a);}
    else d.appendChild(document.createTextNode(p));
  });
  const st=document.createElement("small");st.className="stamp";st.textContent=timestamp();d.appendChild(st);
  r.appendChild(d);log.scrollTop=log.scrollHeight;
}
function addTrail(id){
  trail.querySelectorAll("li").forEach(l=>l.classList.remove("last"));
  const li=document.createElement("li");li.className="last";
  const lb=document.createElement("span");lb.textContent=N[id].name;li.appendChild(lb);
  const tm=document.createElement("small");tm.className="trail-time";tm.textContent=timestamp();li.appendChild(tm);
  trail.appendChild(li);trail.scrollTop=trail.scrollHeight;
}
function go(id){
  busy=true;optsEl.innerHTML="";
  const n=N[id];
  const r=row("bot");
  const ty=document.createElement("div");ty.className="m bot typing";ty.innerHTML="<i></i><i></i><i></i>";
  r.appendChild(ty);log.scrollTop=log.scrollHeight;
  setTimeout(()=>{
    r.remove();
    n.bot.forEach(b=>bubble(b,"bot"));
    addTrail(id);
    if(n.end){
      const b=document.createElement("button");b.textContent="↺ Empezar de nuevo";b.onclick=start;optsEl.appendChild(b);
    } else {
      n.opts.forEach(o=>{const b=document.createElement("button");b.textContent=o.l;b.onclick=()=>choose(o);optsEl.appendChild(b);});
    }
    busy=false;
  },750);
}
function choose(o){ if(busy)return; bubble(o.u||o.l,"user"); go(o.n); }
function free(text){
  if(busy)return;
  bubble(text,"user");
  const k=KEYS.find(([re])=>re.test(text));
  go(k?k[1]:"fallback");
}
document.getElementById("f").addEventListener("submit",e=>{
  e.preventDefault();const v=inp.value.trim();if(!v)return;inp.value="";free(v);
});
function start(){ log.innerHTML="";trail.innerHTML="";optsEl.innerHTML="";go("inicio"); }
document.getElementById("reset").onclick=start;
start();
</script>
</body>
</html>
